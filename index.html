
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大阪府 │ 東大阪市</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: #3e3e3e;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

.weather-card {
  width: 102%;
  max-width: 700px;
  height: 238px;
  margin: 0 auto;
  padding: 12px 18px 10px;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* 最上方標題 */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  white-space: nowrap;
  font-family: "Noto Serif JP", serif;
  color: #3e3e3e;
}

.location {
  font-size: 20px;
  font-weight: 700;
}

.date {
  font-size: 13px;
  font-weight: 400;
}

/* 目前天氣 */
.top-section {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 65px;
}

.current-weather {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.current-icon {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
}

.current-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.current-temp {
  font-size: 36px;
  line-height: 1;
  font-weight: 400;
  white-space: nowrap;
}

.current-description {
  font-size: 14px;
  line-height: 1.2;
}

/* 七日天氣 */
.forecast {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding-top: 5px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
}

.day-name {
  font-size: 16px;
  white-space: nowrap;
}

.day-icon {
  width: 35px;
  height: 35px;
}

.temperatures {
  display: flex;
  gap: 3px;
  font-size: 14px;
  white-space: nowrap;
}

.high {
  font-weight: 600;
}

.low {
  opacity: 0.55;
}

.status {
  font-size: 11px;
  white-space: nowrap;
  min-height: 12px;
}

/* 手機版 */
@media (max-width: 420px) {
  .weather-card {
    width: 100%;
    padding: 12px 10px 10px;
    height: 238px;
  }

  .header {
    gap: 7px;
  }

  .location {
    font-size: 15px;
  }

  .date {
    font-size: 10px;
  }

  .top-section {
    min-height: 65px;
  }

  .current-weather {
    gap: 3px;
  }

  .current-icon {
    width: 38px;
    height: 38px;
  }

  .current-temp {
    font-size: 31px;
  }

  .current-description {
    font-size: 12px;
  }

  .day-name {
    font-size: 13px;
  }

  .day-icon {
    width: 30px;
    height: 30px;
  }

  .temperatures {
    gap: 2px;
    font-size: 12px;
  }

  .status {
    font-size: 10px;
  }

  .day {
    gap: 6px;
  }
}
</style>
</head>

<body>

<div class="weather-card">

  <!-- 最上方置中標題 -->
  <div class="header">
    <div class="location">大阪府 │ 東大阪市</div>
    <div class="date" id="today-date">読み込み中</div>
  </div>

  <!-- 目前天氣 -->
  <div class="top-section">
    <div class="current-weather">

      <div class="current-icon" id="current-icon"></div>

      <div class="current-info">
        <div class="current-temp" id="current-temp">--°</div>
        <div class="current-description" id="current-description">--</div>
      </div>

    </div>
  </div>

  <!-- 七日預報 -->
  <div class="forecast" id="forecast"></div>

</div>

<script>
const latitude = 34.6794;
const longitude = 135.6008;

const weekdays = [
  "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
];

/* 天氣日文文字 */
function weatherText(code) {
  if (code === 0) return "晴れ";
  if (code === 1) return "晴れ";
  if (code === 2) return "晴れ時々曇り";
  if (code === 3) return "曇り";
  if (code === 45 || code === 48) return "霧";

  if ([51, 53, 55].includes(code)) return "小雨";
  if ([56, 57].includes(code)) return "凍雨";

  if ([61, 63, 65].includes(code)) return "雨";
  if ([66, 67].includes(code)) return "凍雨";

  if ([71, 73, 75, 77].includes(code)) return "雪";

  if ([80, 81, 82].includes(code)) return "にわか雨";
  if ([85, 86].includes(code)) return "にわか雪";

  if ([95, 96, 99].includes(code)) return "雷雨";

  return "曇り";
}

/* 天氣圖示 */
function weatherIcon(code, isDay = 1) {
  const sun = `
    <circle cx="32" cy="32" r="12" fill="#F8C84A"/>
    <g stroke="#F8C84A" stroke-width="3" stroke-linecap="round">
      <path d="M32 5 V12 M32 52 V59 M5 32 H12 M52 32 H59
      M13 13 L18 18 M46 46 L51 51
      M51 13 L46 18 M18 46 L13 51"/>
    </g>
  `;

  const moon = `
    <path d="M43 10
    C27 10 17 23 20 37
    C23 50 37 56 49 48
    C35 49 26 37 29 25
    C31 18 36 13 43 10Z"
    fill="#F8C84A"/>
  `;

  const cloud = `
    <path d="M17 45
    C9 45 6 39 8 32
    C10 25 17 22 23 25
    C26 13 40 10 48 19
    C52 23 53 28 52 32
    C62 32 64 44 55 48
    Z"
    fill="#AEBBC7"
    stroke="#AEBBC7"
    stroke-width="2"
    stroke-linejoin="round"/>
  `;

  const partlyCloudy = `
    ${isDay ? sun : moon}
    <path d="M19 48
    C11 48 8 42 10 36
    C12 30 18 28 24 31
    C27 21 39 19 47 26
    C51 30 52 34 51 37
    C61 37 63 48 54 51
    Z"
    fill="#AEBBC7"
    stroke="#AEBBC7"
    stroke-width="2"/>
  `;

  let content = "";

  if (code === 0) {
    content = isDay ? sun : moon;
  } else if ([1, 2].includes(code)) {
    content = partlyCloudy;
  } else if ([3, 45, 48].includes(code)) {
    content = cloud;
  } else if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) {
    content = `
      ${cloud}
      <g stroke="#69A9D6" stroke-width="3" stroke-linecap="round">
        <path d="M22 49 L18 57 M36 49 L32 57 M50 49 L46 57"/>
      </g>
    `;
  } else if ([71, 73, 75, 77, 85, 86].includes(code)) {
    content = `
      ${cloud}
      <g stroke="#69A9D6" stroke-width="2.5" stroke-linecap="round">
        <path d="M20 53 L20 59 M17 56 L23 56
        M36 53 L36 59 M33 56 L39 56
        M51 53 L51 59 M48 56 L54 56"/>
      </g>
    `;
  } else if ([95, 96, 99].includes(code)) {
    content = `
      ${cloud}
      <path d="M36 47 L29 57 H36 L32 65 L46 52 H38 L43 47Z"
      fill="#F5C542"/>
    `;
  } else {
    content = cloud;
  }

  return `
    <svg viewBox="0 0 64 64"
      width="100%" height="100%"
      xmlns="http://www.w3.org/2000/svg">
      ${content}
    </svg>
  `;
}

/* 日本日期 */
function updateDate() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "long"
  }).formatToParts(now);

  const getPart = (type) =>
    parts.find(part => part.type === type).value;

  const year = getPart("year");
  const month = getPart("month");
  const day = getPart("day");
  const weekday = getPart("weekday");

  document.getElementById("today-date").textContent =
    `${year}／${month}／${day}　${weekday}`;
}

/* 取得天氣資料 */
async function loadWeather() {
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}` +
    `&longitude=${longitude}` +
    `&current=temperature_2m,weather_code,is_day` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&timezone=Asia%2FTokyo&forecast_days=7`;

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather API error");

    const data = await response.json();

    /* 目前天氣 */
    const current = data.current;

    document.getElementById("current-temp").textContent =
      `${Math.round(current.temperature_2m)}°`;

    document.getElementById("current-description").textContent =
      weatherText(current.weather_code);

    document.getElementById("current-icon").innerHTML =
      weatherIcon(current.weather_code, current.is_day);

    /* 七日預報 */
    const daily = data.daily;
    const forecast = document.getElementById("forecast");

    forecast.innerHTML = "";

    for (let i = 0; i < 7; i++) {
      const [year, month, dayNumber] =
        daily.time[i].split("-").map(Number);

      const date = new Date(
        Date.UTC(year, month - 1, dayNumber)
      );

      const weekday = weekdays[date.getUTCDay()];
      const code = daily.weather_code[i];

      const high = Math.round(
        daily.temperature_2m_max[i]
      );

      const low = Math.round(
        daily.temperature_2m_min[i]
      );

      const dayElement = document.createElement("div");
      dayElement.className = "day";

      dayElement.innerHTML = `
        <div class="day-name">${weekday}</div>

        <div class="day-icon">
          ${weatherIcon(code, 1)}
        </div>

        <div class="temperatures">
          <span class="high">${high}°</span>
          <span class="low">${low}°</span>
        </div>

        <div class="status">${weatherText(code)}</div>
      `;

      forecast.appendChild(dayElement);
    }

  } catch (error) {
    console.error("天気情報を取得できませんでした", error);

    document.getElementById("current-description").textContent =
      "取得失敗";
  }
}

/* 啟動 */
updateDate();
loadWeather();

setInterval(loadWeather, 30 * 60 * 1000);
setInterval(updateDate, 60 * 1000);
</script>

</body>
</html>
