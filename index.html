
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪府 │ 東大阪市</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: #3e3e3e;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

.weather-card {
  width: 102%;
  max-width: 700px;
  height: 238px;
  margin: 0 auto;
  padding: 12px 18px 10px;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* 今日天氣區域 */
.top-section {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 65px;
}

/* 地點與日期 */
.location-area {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.location {
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
}

.date {
  font-size: 13px;
  white-space: nowrap;
}

/* 今日天氣：圖示與溫度整組置中 */
.current-weather {
  grid-column: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.current-icon {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
}

.current-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.current-temp {
  font-size: 36px;
  line-height: 1;
  font-weight: 400;
  white-space: nowrap;
}

.current-description {
  font-size: 14px;
  line-height: 1.2;
}

/* 七日天氣 */
.forecast {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding-top: 5px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
}

.day-name {
  font-size: 16px;
  white-space: nowrap;
}

.day-icon {
  width: 35px;
  height: 35px;
}

.temperatures {
  display: flex;
  gap: 3px;
  font-size: 14px;
  white-space: nowrap;
}

.high {
  font-weight: 600;
}

.low {
  opacity: 0.55;
}

.status {
  font-size: 11px;
  white-space: nowrap;
  min-height: 12px;
}

/* 手機版 */
@media (max-width: 420px) {
  .weather-card {
    width: 100%;
    padding: 12px 10px 10px;
    height: 238px;
  }

  .top-section {
    grid-template-columns: 1fr auto 1fr;
    min-height: 65px;
  }

  .location-area {
    gap: 7px;
  }

  .location {
    font-size: 14px;
  }

  .date {
    font-size: 11px;
  }

  .current-weather {
    gap: 3px;
  }

  .current-icon {
    width: 38px;
    height: 38px;
  }

  .current-temp {
    font-size: 31px;
  }

  .current-description {
    font-size: 12px;
  }

  .day-name {
    font-size: 13px;
  }

  .day-icon {
    width: 30px;
    height: 30px;
  }

  .temperatures {
    gap: 2px;
    font-size: 12px;
  }

  .status {
    font-size: 10px;
  }

  .day {
    gap: 6px;
  }
}
</style>
</head>

<body>

<div class="weather-card">

  <div class="top-section">

    <div class="location-area">
      <div class="location">大阪府 │ 東大阪市</div>
      <div class="date" id="today-date">読み込み中</div>
    </div>

    <!-- 今日の天気：圖示＋溫度 -->
    <div class="current-weather">
      <div class="current-icon" id="current-icon"></div>

      <div class="current-info">
        <div class="current-temp" id="current-temp">--°</div>
        <div class="current-description" id="current-description">--</div>
      </div>
    </div>

  </div>

  <!-- 七日預報 -->
  <div class="forecast" id="forecast"></div>

</div>

<script>
const latitude = 34.6794;
const longitude = 135.6008;

const weatherLabels = {
  0: "晴れ",
  1: "晴れ",
  2: "曇り",
  3: "曇り",
  45: "霧",
  48: "霧",
  51: "小雨",
  53: "小雨",
  55: "雨",
  56: "小雨",
  57: "雨",
  61: "小雨",
  63: "雨",
  65: "雨",
  66: "雨",
  67: "雨",
  71: "雪",
  73: "雪",
  75: "雪",
  77: "雪",
  80: "小雨",
  81: "雨",
  82: "雨",
  85: "雪",
  86: "雪",
  95: "雷雨",
  96: "雷雨",
  99: "雷雨"
};

/* 天氣圖示 */
function weatherIcon(code, isDay = 1) {
  const sun = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <g fill="none" stroke="#F5B942" stroke-width="4"
         stroke-linecap="round">
        <path d="M32 5V12 M32 52V59 M5 32H12 M52 32H59
        M12.9 12.9L18 18 M46 46L51.1 51.1
        M51.1 12.9L46 18 M18 46L12.9 51.1"/>
      </g>
      <circle cx="32" cy="32" r="13" fill="#F8C957"/>
    </svg>`;

  const moon = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <path d="M42 9
      C25 12 18 31 27 45
      C34 56 48 56 57 47
      C44 49 31 37 33 24
      C34 17 37 12 42 9Z"
      fill="#E8C96B"/>
    </svg>`;

  const cloud = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <path d="M17 45
      C8 45 6 33 14 28
      C16 18 29 15 36 23
      C47 19 56 28 54 38
      C53 43 49 45 44 45Z"
      fill="#BFC9D3"/>
    </svg>`;

  const sunCloud = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <circle cx="24" cy="22" r="11" fill="#F8C957"/>
      <path d="M17 48
      C8 48 7 36 15 32
      C17 23 30 21 36 29
      C47 25 57 34 54 43
      C53 47 49 48 44 48Z"
      fill="#BFC9D3"/>
    </svg>`;

  const rain = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <path d="M17 38
      C8 38 7 27 15 23
      C18 13 31 12 37 21
      C47 17 56 26 53 34
      C52 38 48 39 44 39Z"
      fill="#BFC9D3"/>
      <g stroke="#75A9D1" stroke-width="3" stroke-linecap="round">
        <path d="M22 45L18 53 M34 45L30 53 M46 45L42 53"/>
      </g>
    </svg>`;

  const snow = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <path d="M17 38
      C8 38 7 27 15 23
      C18 13 31 12 37 21
      C47 17 56 26 53 34
      C52 38 48 39 44 39Z"
      fill="#BFC9D3"/>
      <g fill="#8BBAD9">
        <circle cx="20" cy="48" r="3"/>
        <circle cx="32" cy="53" r="3"/>
        <circle cx="44" cy="48" r="3"/>
      </g>
    </svg>`;

  const thunder = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <path d="M17 37
      C8 37 7 26 15 22
      C18 12 31 11 37 20
      C47 16 56 25 53 34
      C52 37 48 38 44 38Z"
      fill="#AEBBC9"/>
      <path d="M33 35L24 49H33L29 60L44 43H35L40 35Z"
      fill="#F4C34E"/>
    </svg>`;

  if (code === 0 || code === 1) {
    return isDay ? sun : moon;
  }

  if (code === 2) {
    return sunCloud;
  }

  if (code === 3 || code === 45 || code === 48) {
    return cloud;
  }

  if (code >= 51 && code <= 67) {
    return rain;
  }

  if (code >= 71 && code <= 77) {
    return snow;
  }

  if (code >= 80 && code <= 82) {
    return rain;
  }

  if (code >= 85 && code <= 86) {
    return snow;
  }

  if (code >= 95) {
    return thunder;
  }

  return cloud;
}

/* 最上方日期：日文星期 */
function updateDate() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "long"
  }).formatToParts(now);

  const getPart = (type) =>
    parts.find(part => part.type === type).value;

  const year = getPart("year");
  const month = getPart("month");
  const day = getPart("day");
  const weekday = getPart("weekday");

  document.getElementById("today-date").textContent =
    `${year}／${month}／${day}　${weekday}`;
}

/* 取得天氣資料 */
async function loadWeather() {
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}` +
    `&longitude=${longitude}` +
    `&current=temperature_2m,weather_code,is_day` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&timezone=Asia%2FTokyo&forecast_days=7`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    /* 今日天氣 */
    const current = data.current;
    const currentCode = current.weather_code;
    const isDay = current.is_day;

    document.getElementById("current-temp").textContent =
      `${Math.round(current.temperature_2m)}°`;

    document.getElementById("current-description").textContent =
      weatherLabels[currentCode] || "曇り";

    document.getElementById("current-icon").innerHTML =
      weatherIcon(currentCode, isDay);

    /* 七日預報 */
    const daily = data.daily;
    const forecast = document.getElementById("forecast");

    forecast.innerHTML = "";

    /* 下方七日星期維持英文 */
    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    for (let i = 0; i < 7; i++) {
      const [year, month, dayNumber] =
        daily.time[i].split("-").map(Number);

      const date = new Date(Date.UTC(year, month - 1, dayNumber));
      const weekday = weekdays[date.getUTCDay()];

      const code = daily.weather_code[i];
      const high = Math.round(daily.temperature_2m_max[i]);
      const low = Math.round(daily.temperature_2m_min[i]);

      const day = document.createElement("div");
      day.className = "day";

      day.innerHTML = `
        <div class="day-name">${weekday}</div>
        <div class="day-icon">${weatherIcon(code, 1)}</div>
        <div class="temperatures">
          <span class="high">${high}°</span>
          <span class="low">${low}°</span>
        </div>
        <div class="status">${weatherLabels[code] || "曇り"}</div>
      `;

      forecast.appendChild(day);
    }

  } catch (error) {
    console.error("Weather loading error:", error);
    document.getElementById("current-description").textContent = "取得失敗";
  }
}

updateDate();
loadWeather();

/* 每 30 分鐘更新一次 */
setInterval(loadWeather, 30 * 60 * 1000);
setInterval(updateDate, 60 * 1000);

</script>

</body>
</html>
