
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪府 │ 東大阪市</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: #3e3e3e;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

.weather-card {
  width: 96%;
  max-width: 650px;
  height: 238px;
  margin: 0 auto;
  padding: 12px 14px 10px;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  white-space: nowrap;
  font-family: "Noto Serif JP", serif;
  color: #3e3e3e;
}

.location {
  font-size: 19px;
  font-weight: 700;
}

.date {
  font-size: 13px;
  font-weight: 400;
}

.top-section {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 65px;
}

/* 第二行：當日天氣 */
.current-weather {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.current-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
}

.current-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

/* 只有當日溫度使用 Noto Serif JP */
.current-temp {
  font-family: "Noto Serif JP", serif;
  font-size: 36px;
  line-height: 1;
  font-weight: 400;
  white-space: nowrap;
}

/* 只有當日天氣描述使用 Noto Serif JP */
.current-description {
  font-family: "Noto Serif JP", serif;
  font-size: 14px;
  line-height: 1.2;
}

/* 第三行：七日天氣 */
.forecast {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding-top: 5px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
}

.day-name {
  font-size: 15px;
  white-space: nowrap;
}

.day-icon {
  width: 35px;
  height: 35px;
}

.temperatures {
  display: flex;
  gap: 3px;
  font-size: 14px;
  white-space: nowrap;
}

.high {
  font-weight: 600;
}

.low {
  opacity: 0.5;
}

.status {
  font-size: 11px;
  white-space: nowrap;
  min-height: 12px;
}

@media (max-width: 420px) {

  .weather-card {
    width: 96%;
    max-width: none;
    height: 238px;
    padding: 12px 7px 10px;
  }

  .header {
    gap: 7px;
  }

  .location {
    font-size: 15px;
  }

  .date {
    font-size: 10px;
  }

  .top-section {
    min-height: 65px;
  }

  .current-weather {
    gap: 5px;
  }

  .current-icon {
    width: 42px;
    height: 42px;
  }

  .current-temp {
    font-size: 32px;
  }

  .current-description {
    font-size: 12px;
  }

  .day {
    gap: 6px;
  }

  .day-name {
    font-size: 12px;
  }

  .day-icon {
    width: 29px;
    height: 29px;
  }

  .temperatures {
    gap: 2px;
    font-size: 11px;
  }

  .status {
    font-size: 9px;
  }
}

</style>
</head>

<body>

<div class="weather-card">

  <div class="header">
    <div class="location">大阪府 │ 東大阪市</div>
    <div class="date" id="today-date">読み込み中</div>
  </div>

  <div class="top-section">
    <div class="current-weather">

      <div class="current-icon" id="current-icon"></div>

      <div class="current-info">
        <div class="current-temp" id="current-temp">--°</div>
        <div class="current-description" id="current-description">--</div>
      </div>

    </div>
  </div>

  <div class="forecast" id="forecast"></div>

</div>

<script>

const latitude = 34.6794;
const longitude = 135.6008;

const weekdays = [
  "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
];

function weatherText(code) {

  if (code === 0) return "晴れ";
  if (code === 1) return "晴れ";
  if (code === 2) return "晴れ時々曇り";
  if (code === 3) return "曇り";
  if ([45, 48].includes(code)) return "霧";
  if ([51, 53, 55].includes(code)) return "小雨";
  if ([56, 57].includes(code)) return "凍雨";
  if ([61, 63, 65, 66, 67].includes(code)) return "雨";
  if ([71, 73, 75, 77].includes(code)) return "雪";
  if ([80, 81, 82].includes(code)) return "にわか雨";
  if ([85, 86].includes(code)) return "にわか雪";
  if ([95, 96, 99].includes(code)) return "雷雨";

  return "曇り";
}


// 原本柔和填色風格天氣圖示
function weatherIcon(code, isDay = 1) {

  const sun = `
    <g>
      <g stroke="#F5B94C" stroke-width="3.5"
         stroke-linecap="round">
        <path d="M32 5 V12 M32 52 V59
                 M5 32 H12 M52 32 H59
                 M13 13 L18 18 M46 46 L51 51
                 M51 13 L46 18 M18 46 L13 51"/>
      </g>
      <circle cx="32" cy="32" r="13"
        fill="#FFD76A" stroke="#F5B94C" stroke-width="2"/>
    </g>
  `;

  const moon = `
    <path d="M43 8
      C27 9 18 22 21 37
      C23 50 37 57 49 49
      C37 49 29 39 30 27
      C31 18 36 11 43 8Z"
      fill="#F7D98B"/>
  `;

  const cloud = `
    <path d="
      M16 48
      C8 48 5 42 6 35
      C7 28 13 23 21 24
      C24 14 33 10 42 14
      C48 17 51 22 51 28
      C59 28 62 34 61 40
      C60 45 56 48 50 48Z"
      fill="#DCE7EF"/>
  `;

  const rain = `
    <g stroke="#69BDEB" stroke-width="4"
       stroke-linecap="round">
      <path d="M20 53 L17 60"/>
      <path d="M33 53 L30 60"/>
      <path d="M46 53 L43 60"/>
    </g>
  `;

  const snow = `
    <g stroke="#70BDEB" stroke-width="2.5"
       stroke-linecap="round">
      <path d="M32 51 V63 M26 54 L38 60 M38 54 L26 60"/>
      <path d="M32 51 L29 54 M32 51 L35 54"/>
      <path d="M32 63 L29 60 M32 63 L35 60"/>
    </g>
  `;

  const lightning = `
    <path d="M35 47 L25 59 L32 59
      L28 68 L43 53 L35 53 L40 47Z"
      fill="#FFD66B"/>
  `;

  const fog = `
    <g stroke="#A9BAC8" stroke-width="3"
       stroke-linecap="round">
      <path d="M12 54 H52"/>
      <path d="M18 61 H46"/>
    </g>
  `;

  let icon = "";

  if (code === 0 || code === 1) {
    icon = isDay ? sun : moon;

  } else if (code === 2) {
    icon = `
      <g transform="translate(-5,-5) scale(0.78)">
        ${isDay ? sun : moon}
      </g>
      <g transform="translate(5,7) scale(0.85)">
        ${cloud}
      </g>
    `;

  } else if (code === 3) {
    icon = cloud;

  } else if ([45, 48].includes(code)) {
    icon = cloud + fog;

  } else if (
    [51, 53, 55, 56, 57, 61, 63, 65,
     66, 67, 80, 81, 82].includes(code)
  ) {
    icon = cloud + rain;

  } else if ([71, 73, 75, 77, 85, 86].includes(code)) {
    icon = cloud + snow;

  } else if ([95, 96, 99].includes(code)) {
    icon = cloud + lightning + rain;

  } else {
    icon = cloud;
  }

  return `
    <svg viewBox="0 0 64 72"
      width="100%" height="100%"
      xmlns="http://www.w3.org/2000/svg">
      ${icon}
    </svg>
  `;
}


// 日本時間日期
function updateDate() {

  const now = new Date();

  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "long"
  }).formatToParts(now);

  const getPart = type =>
    parts.find(part => part.type === type).value;

  document.getElementById("today-date").textContent =
    `${getPart("year")}／${getPart("month")}／${getPart("day")}　${getPart("weekday")}`;
}


// 即時天氣及七日預報
async function loadWeather() {

  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}` +
    `&longitude=${longitude}` +
    `&current=temperature_2m,weather_code,is_day` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&timezone=Asia%2FTokyo&forecast_days=7`;

  try {

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Weather API error");
    }

    const data = await response.json();
    const current = data.current;

    // 當日天氣
    document.getElementById("current-temp").textContent =
      `${Math.round(current.temperature_2m)}°`;

    document.getElementById("current-description").textContent =
      weatherText(current.weather_code);

    document.getElementById("current-icon").innerHTML =
      weatherIcon(current.weather_code, current.is_day);


    // 七日天氣
    const daily = data.daily;
    const forecast = document.getElementById("forecast");

    forecast.innerHTML = "";

    for (let i = 0; i < 7; i++) {

      const [year, month, dayNumber] =
        daily.time[i].split("-").map(Number);

      const date = new Date(
        Date.UTC(year, month - 1, dayNumber)
      );

      const weekday = weekdays[date.getUTCDay()];
      const code = daily.weather_code[i];

      const high = Math.round(
        daily.temperature_2m_max[i]
      );

      const low = Math.round(
        daily.temperature_2m_min[i]
      );

      const dayElement = document.createElement("div");

      dayElement.className = "day";

      dayElement.innerHTML = `
        <div class="day-name">${weekday}</div>

        <div class="day-icon">
          ${weatherIcon(code, 1)}
        </div>

        <div class="temperatures">
          <span class="high">${high}°</span>
          <span class="low">${low}°</span>
        </div>

        <div class="status">
          ${weatherText(code)}
        </div>
      `;

      forecast.appendChild(dayElement);
    }

  } catch (error) {

    console.error("天気情報を取得できませんでした", error);

    document.getElementById("current-description")
      .textContent = "取得失敗";
  }
}


// 初始化
updateDate();
loadWeather();

// 每 30 分鐘更新天氣
setInterval(loadWeather, 30 * 60 * 1000);

// 每分鐘更新日期
setInterval(updateDate, 60 * 1000);

</script>

</body>
</html>
