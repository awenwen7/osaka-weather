
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大阪府 │ 東大阪市</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: #3e3e3e;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

/* 天氣卡片 */
.weather-card {
  width: 96%;
  max-width: 650px;
  height: 238px;
  margin: 0 auto;
  padding: 12px 14px 10px;
  background: #FFFFFF;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* 第一區：最上方標題 */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  white-space: nowrap;

  font-family: "Noto Serif JP", serif;
  color: #3e3e3e;
}

.location {
  font-size: 19px;
  font-weight: 700;
}

.date {
  font-size: 13px;
  font-weight: 400;
}

/* 第二區：當日天氣 */
.top-section {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 65px;
}

.current-weather {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.current-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
}

.current-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.current-temp {
  font-size: 36px;
  line-height: 1;
  font-weight: 400;
  white-space: nowrap;
}

.current-description {
  font-size: 14px;
  line-height: 1.2;
}

/* 第三區：七日天氣 */
.forecast {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding-top: 5px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
}

.day-name {
  font-size: 15px;
  white-space: nowrap;
}

.day-icon {
  width: 35px;
  height: 35px;
}

.temperatures {
  display: flex;
  gap: 3px;
  font-size: 14px;
  white-space: nowrap;
}

.high {
  font-weight: 600;
}

.low {
  opacity: 0.5;
}

.status {
  font-size: 11px;
  white-space: nowrap;
  min-height: 12px;
}

/* 手機版 */
@media (max-width: 420px) {
  .weather-card {
    width: 96%;
    max-width: none;
    height: 238px;
    padding: 12px 7px 10px;
  }

  .header {
    gap: 7px;
  }

  .location {
    font-size: 15px;
  }

  .date {
    font-size: 10px;
  }

  .top-section {
    min-height: 65px;
  }

  .current-weather {
    gap: 5px;
  }

  .current-icon {
    width: 42px;
    height: 42px;
  }

  .current-temp {
    font-size: 32px;
  }

  .current-description {
    font-size: 12px;
  }

  .day {
    gap: 6px;
  }

  .day-name {
    font-size: 12px;
  }

  .day-icon {
    width: 29px;
    height: 29px;
  }

  .temperatures {
    gap: 2px;
    font-size: 11px;
  }

  .status {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div class="weather-card">

  <!-- 第一區：標題 -->
  <div class="header">
    <div class="location">大阪府 │ 東大阪市</div>
    <div class="date" id="today-date">読み込み中</div>
  </div>

  <!-- 第二區：當日天氣 -->
  <div class="top-section">
    <div class="current-weather">

      <div class="current-icon" id="current-icon"></div>

      <div class="current-info">
        <div class="current-temp" id="current-temp">--°</div>
        <div class="current-description" id="current-description">--</div>
      </div>

    </div>
  </div>

  <!-- 第三區：七日天氣 -->
  <div class="forecast" id="forecast"></div>

</div>

<script>
const latitude = 34.6794;
const longitude = 135.6008;

const weekdays = [
  "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
];

/* 天氣日文名稱 */
function weatherText(code) {
  if (code === 0) return "晴れ";
  if (code === 1) return "晴れ";
  if (code === 2) return "晴れ時々曇り";
  if (code === 3) return "曇り";

  if ([45, 48].includes(code)) return "霧";

  if ([51, 53, 55].includes(code)) return "小雨";
  if ([56, 57].includes(code)) return "凍雨";

  if ([61, 63, 65, 66, 67].includes(code)) return "雨";

  if ([71, 73, 75, 77].includes(code)) return "雪";

  if ([80, 81, 82].includes(code)) return "にわか雨";
  if ([85, 86].includes(code)) return "にわか雪";

  if ([95, 96, 99].includes(code)) return "雷雨";

  return "曇り";
}

/* 全新線條風格天氣圖示 */
function weatherIcon(code, isDay = 1) {

  const sun = `
    <circle cx="32" cy="32" r="11"
      fill="#F8D36B"/>

    <g stroke="#E9B94D"
      stroke-width="2.5"
      stroke-linecap="round">

      <path d="
        M32 5 V12
        M32 52 V59
        M5 32 H12
        M52 32 H59
        M13 13 L18 18
        M46 46 L51 51
        M51 13 L46 18
        M18 46 L13 51
      "/>
    </g>
  `;

  const moon = `
    <path d="
      M42 10
      C27 10 17 23 20 38
      C23 52 39 57 50 47
      C38 50 27 41 27 29
      C27 20 33 13 42 10Z
    "
    fill="#EACB76"/>
  `;

  const cloud = `
    <path d="
      M18 45
      C10 45 7 40 8 34
      C9 28 14 24 21 25
      C23 15 34 11 43 17
      C48 20 50 25 49 30
      C57 29 62 35 61 41
      C60 46 56 49 51 49
      H18
    "
    fill="#FFFFFF"
    stroke="#AAB8C4"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  `;

  const rain = `
    <g stroke="#79B7DB"
      stroke-width="3"
      stroke-linecap="round">

      <path d="M22 49 L18 57"/>
      <path d="M36 49 L32 57"/>
      <path d="M50 49 L46 57"/>
    </g>
  `;

  const snow = `
    <g stroke="#79B7DB"
      stroke-width="2"
      stroke-linecap="round">

      <path d="
        M20 51 V59
        M16 55 H24
        M17 52 L23 58
        M23 52 L17 58
      "/>

      <path d="
        M39 51 V59
        M35 55 H43
        M36 52 L42 58
        M42 52 L36 58
      "/>
    </g>
  `;

  const lightning = `
    <path d="
      M36 47
      L27 59
      H35
      L31 68
      L46 52
      H38
      L43 47Z
    "
    fill="#F2C14E"/>
  `;

  const fog = `
    <g stroke="#AAB8C4"
      stroke-width="2.5"
      stroke-linecap="round">

      <path d="M13 50 H51"/>
      <path d="M19 57 H56"/>
      <path d="M8 43 H44"/>
    </g>
  `;

  let content = "";

  /* 晴天 */
  if (code === 0) {
    content = isDay ? sun : moon;
  }

  /* 晴時多雲、部分多雲 */
  else if ([1, 2].includes(code)) {
    content = `
      <g transform="translate(-5,-5) scale(0.8)">
        ${isDay ? sun : moon}
      </g>
      ${cloud}
    `;
  }

  /* 多雲 */
  else if (code === 3) {
    content = cloud;
  }

  /* 霧 */
  else if ([45, 48].includes(code)) {
    content = `
      ${cloud}
      ${fog}
    `;
  }

  /* 雨、毛毛雨 */
  else if (
    [51, 53, 55, 56, 57,
     61, 63, 65, 66, 67,
     80, 81, 82].includes(code)
  ) {
    content = `
      ${cloud}
      ${rain}
    `;
  }

  /* 下雪 */
  else if ([71, 73, 75, 77, 85, 86].includes(code)) {
    content = `
      ${cloud}
      ${snow}
    `;
  }

  /* 雷雨 */
  else if ([95, 96, 99].includes(code)) {
    content = `
      ${cloud}
      ${lightning}
    `;
  }

  else {
    content = cloud;
  }

  return `
    <svg viewBox="0 0 64 64"
      width="100%"
      height="100%"
      xmlns="http://www.w3.org/2000/svg">

      ${content}

    </svg>
  `;
}

/* 日本日期 */
function updateDate() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "long"
  }).formatToParts(now);

  const getPart = (type) =>
    parts.find(part => part.type === type).value;

  const year = getPart("year");
  const month = getPart("month");
  const day = getPart("day");
  const weekday = getPart("weekday");

  document.getElementById("today-date").textContent =
    `${year}／${month}／${day}　${weekday}`;
}

/* 取得天氣資料 */
async function loadWeather() {

  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}` +
    `&longitude=${longitude}` +
    `&current=temperature_2m,weather_code,is_day` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&timezone=Asia%2FTokyo&forecast_days=7`;

  try {

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Weather API error");
    }

    const data = await response.json();

    /* 當日天氣 */
    const current = data.current;

    document.getElementById("current-temp").textContent =
      `${Math.round(current.temperature_2m)}°`;

    document.getElementById("current-description").textContent =
      weatherText(current.weather_code);

    document.getElementById("current-icon").innerHTML =
      weatherIcon(current.weather_code, current.is_day);

    /* 七日天氣 */
    const daily = data.daily;
    const forecast = document.getElementById("forecast");

    forecast.innerHTML = "";

    for (let i = 0; i < 7; i++) {

      const [year, month, dayNumber] =
        daily.time[i].split("-").map(Number);

      const date = new Date(
        Date.UTC(year, month - 1, dayNumber)
      );

      const weekday = weekdays[date.getUTCDay()];
      const code = daily.weather_code[i];

      const high = Math.round(
        daily.temperature_2m_max[i]
      );

      const low = Math.round(
        daily.temperature_2m_min[i]
      );

      const dayElement = document.createElement("div");

      dayElement.className = "day";

      dayElement.innerHTML = `
        <div class="day-name">${weekday}</div>

        <div class="day-icon">
          ${weatherIcon(code, 1)}
        </div>

        <div class="temperatures">
          <span class="high">${high}°</span>
          <span class="low">${low}°</span>
        </div>

        <div class="status">
          ${weatherText(code)}
        </div>
      `;

      forecast.appendChild(dayElement);
    }

  } catch (error) {

    console.error("天気情報を取得できませんでした", error);

    document.getElementById("current-description").textContent =
      "取得失敗";
  }
}

/* 啟動 */
updateDate();
loadWeather();

/* 每30分鐘更新天氣 */
setInterval(loadWeather, 30 * 60 * 1000);

/* 每分鐘更新日期 */
setInterval(updateDate, 60 * 1000);

</script>

</body>
</html>
