
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>2027 デート</title>
<style>
* { box-sizing: border-box; }

body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container { text-align: center; }

.title {
    font-family: serif;
    color: #3e3e3e;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 28px;
}

.flip-card {
    background: #c0e3d9;
    border-radius: 12px;
    padding: 25px 40px;
    min-width: 170px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.number {
    font-family: 'Noto Serif JP', serif;
    color: #3e3e3e;
    font-size: 64px;
    font-weight: 600;
    line-height: 1.2;
    display: inline-block;
}

.flip {
    animation: flip 0.6s ease-in-out;
    transform-origin: center center;
}

@keyframes flip {
    0% { transform: rotateX(0deg); opacity: 1; }
    50% { transform: rotateX(-90deg); opacity: 0; }
    100% { transform: rotateX(0deg); opacity: 1; }
}

.label {
    font-family: 'Noto Serif JP', serif;
    color: #3e3e3e;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 10px;
}
</style>
</head>
<body>
<div class="container">
    <div class="title">2027 デート</div>
    <div class="flip-card">
        <div class="number" id="days">0</div>
        <div class="label">DAYS</div>
    </div>
</div>
<script>
const target = Date.UTC(2027, 0, 31, 0, 0, 0);
let previousDays = null;

function updateCountdown() {
    const now = new Date();
    const japanNow = now.getTime()
        + now.getTimezoneOffset() * 60000
        + 9 * 60 * 60000;
    const diff = target - japanNow;
    const days = Math.max(0, Math.ceil(diff / 86400000));
    const element = document.getElementById("days");

    if (days !== previousDays) {
        element.classList.remove("flip");
        void element.offsetWidth;
        element.textContent = days;
        element.classList.add("flip");
        previousDays = days;
    }
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
